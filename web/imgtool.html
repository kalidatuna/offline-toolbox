<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Shrinker</title>
<style>
:root{--bg:#fff;--fg:#1c1e21;--mut:#6b7280;--card:#f6f7f9;--bd:#d9dce1;--ac:#2563eb;--ok:#1b7f3b}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e6e8eb;--mut:#9aa1ab;--card:#1d2026;--bd:#333842;--ac:#6ea0ff;--ok:#56d364}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 12px}
#drop{border:2px dashed var(--bd);border-radius:10px;padding:28px;text-align:center;color:var(--mut);cursor:pointer;background:var(--card)}#drop.on{border-color:var(--ac)}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;align-items:end}label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:2px}
input,select,button{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.item{display:flex;gap:12px;align-items:center;padding:8px;border-bottom:1px solid var(--bd)}.item img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--card)}.item .i{flex:1;min-width:0}.item .i div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv{color:var(--ok);font-weight:600}
</style></head><body><main>
<h1>Image Shrinker</h1><p class="s">Resize, compress and convert images (JPEG/WebP/PNG). Re-encoding also strips EXIF data like GPS location. Nothing is uploaded.</p>
<div id="drop">Drop images here or click to choose<input id="file" type="file" accept="image/*" multiple hidden></div>
<div class="opts">
<label>Max width/height (px)<input id="max" type="number" value="1600" min="16"></label>
<label>Format<select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select></label>
<label>Quality <span id="qv">80</span>%<input id="q" type="range" min="10" max="100" value="80"></label>
<button id="go" class="p">Process</button><button id="zip" hidden>Download all</button></div>
<div id="list"></div>
<script>
// LOGIC-START
function fitSize(w,h,max){
  if(w<=max&&h<=max)return {w,h};
  const s=max/Math.max(w,h);
  return {w:Math.max(1,Math.round(w*s)),h:Math.max(1,Math.round(h*s))};
}
function outName(name,mime){
  const ext={"image/jpeg":"jpg","image/webp":"webp","image/png":"png"}[mime]||"img";
  return name.replace(/\.[^.]+$/,"")+"-small."+ext;
}
function fmtBytes(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";}
// LOGIC-END
const $=id=>document.getElementById(id);
let files=[],results=[];
$("drop").onclick=()=>$("file").click();
$("file").onchange=e=>{files=[...e.target.files];show();};
["dragover","dragenter"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.add("on");}));
["dragleave","drop"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.remove("on");}));
$("drop").addEventListener("drop",e=>{files=[...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"));show();});
$("q").oninput=()=>$("qv").textContent=$("q").value;
function show(){$("list").textContent="";results=[];$("zip").hidden=true;files.forEach(f=>{const d=document.createElement("div");d.className="item";d.textContent=`${f.name} (${fmtBytes(f.size)})`;$("list").appendChild(d);});}
function load(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(u);res(img);};img.onerror=()=>rej(new Error("cannot decode"));img.src=u;});}
function toBlob(c,mime,q){return new Promise(r=>c.toBlob(r,mime,q));}
$("go").onclick=async()=>{
  $("list").textContent="";results=[];
  const mime=$("fmt").value,q=$("q").value/100,max=+$("max").value||1600;
  for(const f of files){
    const row=document.createElement("div");row.className="item";$("list").appendChild(row);
    try{
      const img=await load(f),{w,h}=fitSize(img.naturalWidth,img.naturalHeight,max);
      const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");
      if(mime==="image/jpeg"){ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);}
      ctx.drawImage(img,0,0,w,h);
      const blob=await toBlob(c,mime,q);
      const url=URL.createObjectURL(blob),name=outName(f.name,mime);
      results.push({blob,name});
      const pct=Math.round((1-blob.size/f.size)*100);
      row.innerHTML="";
      const t=document.createElement("img");t.src=url;t.alt="";
      const i=document.createElement("div");i.className="i";
      const n=document.createElement("div");n.textContent=name;
      const s=document.createElement("div");s.textContent=`${img.naturalWidth}×${img.naturalHeight} → ${w}×${h} · ${fmtBytes(f.size)} → ${fmtBytes(blob.size)} `;
      const sv=document.createElement("span");sv.className="sv";sv.textContent=pct>0?`-${pct}%`:`+${-pct}%`;s.appendChild(sv);
      i.append(n,s);
      const a=document.createElement("a");a.href=url;a.download=name;const b=document.createElement("button");b.textContent="Save";a.appendChild(b);
      row.append(t,i,a);
    }catch(e){row.textContent=`${f.name}: ${e.message}`;}
  }
  $("zip").hidden=results.length<2;
};
$("zip").onclick=()=>{ // no zip lib offline: download sequentially
  results.forEach((r,i)=>setTimeout(()=>{const a=document.createElement("a");a.href=URL.createObjectURL(r.blob);a.download=r.name;a.click();},i*300));
};
</script></main></body></html>
